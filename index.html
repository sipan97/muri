<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muri | موری - گەوهەرێ زانیاریان</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome بۆ ئایکۆنان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- سەرەتا یا ناڤەڕۆکا سەرەکی یا مالپەری -->
    <header>
        <div class="logo">Muri <span>موری | گەوهەرێ زانیاریان</span></div>
        <nav>
            <a href="#home">سەرەکی</a>
            <a href="#ppt-section" class="active">پاوەرپۆینت</a>
            <a href="#ministerial">پرسیارێن وەزاری</a>
            <a href="#quiz">کویز</a>
            <a href="#about">دەربارەی من</a>
        </nav>
        <button class="admin-btn" onclick="toggleAdminPanel()"><i class="fa-solid fa-user-shield"></i> ئەدمین</button>
    </header>

    <main>
        <!-- پشکا پاوەرپۆینت (PPT) و وانەیان -->
        <section id="ppt-section" class="container">
            <div class="section-header">
                <h2 class="section-title">پاوەرپۆینت (PPT) و وانەیێن ئابووری</h2>
                
                <!-- پشکا گەڕیانێ (Search) -->
                <div class="search-box" style="margin: 15px 0;">
                    <input type="text" id="searchInput" onkeyup="filterLessons()" placeholder="گەریان ل دووڤ ناڤێ وانەیێ..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>

                <!-- دوگمەیێن فلتەرکرنا پۆلان -->
                <div class="filter-controls">
                    <button class="active" onclick="filterByGrade('all', this)">هەموو</button>
                    <button onclick="filterByGrade('10', this)">پۆلا ١٠</button>
                    <button onclick="filterByGrade('11', this)">پۆلا ١١</button>
                    <button onclick="filterByGrade('12', this)">پۆلا ١٢</button>
                </div>
            </div>

            <!-- ئەڤ کانتیرە ب خۆرۆسکی (Automatic) هەمی 210 وانەیان لێرە نیشا ددەت -->
            <div id="lessonsContainer" class="grades-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
                <!-- وانە لێرە دەردەکەفن -->
            </div>
        </section>

        <!-- پشکا پرسیارێن وەزاری -->
        <section id="ministerial" class="container" style="margin-top: 40px;">
            <h2 class="section-title">پرسیارێن وەزاری (PDF)</h2>
            <div id="ministerialContainer" class="grades-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
                <!-- پرسیارێن وەزاری لێرە دەردەکەفن -->
            </div>
        </section>

        <!-- پشکا کویز (تاقیکرن) -->
        <section id="quiz" class="container" style="margin-top: 40px;">
            <h2 class="section-title">تاقیکرن (کویز)</h2>
            <div id="quizContainer" style="margin-top: 20px;">
                <!-- کویز لێرە دەردەکەفن -->
            </div>
        </section>
    </main>

    <!-- پەنجەرا ئەدمینی (Admin Modal) -->
    <div id="adminModal" class="modal hidden" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 400px; max-width: 90%;">
            <h3>زێدەکرنا ناڤەڕۆکا نوو</h3>
            <form id="addContentForm" onsubmit="handleAdminSubmit(event)">
                <label>جۆرێ ناڤەڕۆکێ:</label>
                <select id="contentType" onchange="toggleFormFields()" style="width: 100%; padding: 8px; margin: 10px 0;">
                    <option value="ppt">پاوەرپۆینت (PPT)</option>
                    <option value="ministerial">پرسیارا وەزاری (PDF)</option>
                    <option value="quiz">کویز (تاقیکرن)</option>
                </select>

                <div id="pptFields">
                    <label>پۆل:</label>
                    <select id="lessonGrade" style="width: 100%; padding: 8px; margin: 10px 0;">
                        <option value="10">پۆلا ١٠</option>
                        <option value="11">پۆلا ١١</option>
                        <option value="12">پۆلا ١٢</option>
                    </select>
                </div>

                <label>ناڤێ بابەتی / پرسیارێ:</label>
                <input type="text" id="contentTitle" required style="width: 100%; padding: 8px; margin: 10px 0;">

                <div id="fileGroup">
                    <label>لینکێ فایلێ (یان ڕێڕەو):</label>
                    <input type="text" id="contentFile" placeholder="files/10/lesson.pptx" style="width: 100%; padding: 8px; margin: 10px 0;">
                </div>

                <div id="quizFields" style="display: none;">
                    <label>بژاردە ١:</label>
                    <input type="text" id="opt1" style="width: 100%; padding: 5px; margin: 5px 0;">
                    <label>بژاردە ٢:</label>
                    <input type="text" id="opt2" style="width: 100%; padding: 5px; margin: 5px 0;">
                    <label>بژاردە ٣:</label>
                    <input type="text" id="opt3" style="width: 100%; padding: 5px; margin: 5px 0;">
                    <label>ژمارەیا بژاردەیا ڕاست (بۆ نموونە ١ یان ٢):</label>
                    <input type="number" id="correctOpt" min="1" max="3" style="width: 100%; padding: 5px; margin: 5px 0;">
                </div>

                <button type="submit" style="background: #3b82f6; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%;">تۆمارکرن</button>
                <button type="button" onclick="toggleAdminPanel()" style="background: #ef4444; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; width: 100%;">گ داخستن</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
